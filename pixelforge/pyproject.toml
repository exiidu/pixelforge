[project]
name = "pixelforge"
version = "0.2.1"
description = "图片转像素画引擎：分层索引色输出，确定性管线 + 可选 AI 增强"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "pillow",
    "fastapi",
    "uvicorn[standard]",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*"]

[project.optional-dependencies]
ai = ["onnxruntime"]      # AI 档接入时安装（线稿/抠图模型）
mcp = ["mcp>=2.3"]        # MCP 服务器（stdio）
dev = ["pytest", "mcp>=2.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
